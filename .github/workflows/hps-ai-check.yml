name: hps-ai-check
on:
  push:
    branches: [hps-ai-check]
    paths: ['.github/workflows/hps-ai-check.yml', 'check/trigger.txt']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run checks
        run: |
          O="https://nguyenhongphong1973-dot.github.io"; E="https://cic-survey.pages.dev/api/hps-ai"
          mkdir -p check; R=check/result.txt; : > $R
          echo "== HEALTH" >> $R; curl -s -w "\nHTTP %{http_code}\n" "$E" >> $R
          echo "== CIC LOCKED (expect 302)" >> $R
          for u in https://cic-survey.pages.dev/bizdata.js https://cic-survey.pages.dev/ https://cic-survey.pages.dev/api/certs https://main.cic-survey.pages.dev/bizdata.js https://cic-survey.pages.dev/api/hps-ai2; do echo "$(curl -s -o /dev/null -w '%{http_code}' "$u")  $u" >> $R; done
          echo "== AI QUICK" >> $R
          curl -s -w "\nHTTP %{http_code}\n" -X POST "$E" -H "Origin: $O" -H "content-type: application/json" -d '{"tier":"quick","max_tokens":80,"messages":[{"role":"user","content":"Trả lời đúng 1 câu tiếng Việt: cảng RoRo Tân Vũ ở thành phố nào?"}]}' >> $R
          echo "== AI DEFAULT" >> $R
          curl -s -w "\nHTTP %{http_code}\n" -X POST "$E" -H "Origin: $O" -H "content-type: application/json" -d '{"max_tokens":60,"messages":[{"role":"user","content":"Reply with only: OK"}]}' >> $R
          echo "== WRONG ORIGIN (expect 403)" >> $R
          curl -s -w "\nHTTP %{http_code}\n" -X POST "$E" -H "Origin: https://evil.example" -H "content-type: application/json" -d '{"messages":[{"role":"user","content":"x"}]}' >> $R
          echo "== PREFLIGHT" >> $R
          curl -s -i -X OPTIONS "$E" -H "Origin: $O" -H "Access-Control-Request-Method: POST" | head -10 >> $R
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add check/result.txt; git commit -m "check result [skip ci]"; git push
