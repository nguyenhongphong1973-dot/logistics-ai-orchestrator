name: sat
on:
  push:
    branches: [sat-fetch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python tools/sat.py
      - run: |
          git config user.name "sat-bot"; git config user.email "sat-bot@users.noreply.github.com"
          git add sat && git commit -m "sat images [skip ci]" && git push
