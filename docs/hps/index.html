<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HPS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>HPS Port Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — module rail on the left (stacks to a top strip on phones), working canvas on the right. Yard-paint yellow is the only accent. */
:root{
  --bg:#E8EBED; --surface:#FFFFFF; --surface2:#F3F5F6; --line:#D3D9DD; --ink:#14181C; --muted:#5A666F;
  --accent:#F2B705; --accent-ink:#1C1500; --navy:#1E3A5C;
  --ok:#1D7F47; --warn:#A86A12; --crit:#C02B2B; --info:#2763A6;
  --ok-bg:#E3F3EA; --warn-bg:#FBF0DC; --crit-bg:#FBE4E4; --info-bg:#E2ECF8;
  --tmv:#C8102E; --mmv:#5B4B8A; --ford:#1F4E99;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#1A1E22; --surface2:#20252A; --line:#2E353C; --ink:#E6EAED; --muted:#98A3AC;
  --accent:#F5C21B; --accent-ink:#1C1500; --navy:#9DB8DA;
  --ok:#4CC27F; --warn:#E3A84A; --crit:#F06A6A; --info:#6EA6E6;
  --ok-bg:#16301F; --warn-bg:#33270F; --crit-bg:#3A1A1A; --info-bg:#162638;
  --tmv:#F0566B; --mmv:#A796D8; --ford:#6E9BE3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1A1E22; --surface2:#20252A; --line:#2E353C; --ink:#E6EAED; --muted:#98A3AC;
  --accent:#F5C21B; --accent-ink:#1C1500; --navy:#9DB8DA;
  --ok:#4CC27F; --warn:#E3A84A; --crit:#F06A6A; --info:#6EA6E6;
  --ok-bg:#16301F; --warn-bg:#33270F; --crit-bg:#3A1A1A; --info-bg:#162638;
  --tmv:#F0566B; --mmv:#A796D8; --ford:#6E9BE3; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:34px;height:34px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--accent) 0 7px,var(--ink) 7px 14px);flex:none}
.brand b{font-family:var(--f-disp);font-size:22px;letter-spacing:.02em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:11px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 6px}
.lang button{flex:1;border:0;background:var(--surface);padding:5px 8px;font-size:12px;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--accent);color:var(--accent-ink)}
.navgrp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 8px 2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;color:var(--ink);font-size:13.5px}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--ink);color:var(--surface)}
.nav button .dot{width:7px;height:7px;border-radius:2px;background:var(--line);flex:none}
.nav button.on .dot{background:var(--accent)}
.nav button .ct{margin-left:auto;font-family:var(--f-mono);font-size:11px;opacity:.75}
.tenant{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:10px 8px 0}
main{min-width:0;padding-block:20px 40px;padding-inline:clamp(16px,3vw,32px)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(26px,3.4vw,34px);line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--f-disp);font-weight:600;font-size:20px;margin:0 0 10px;letter-spacing:.02em}
h3{font-size:13px;margin:0 0 8px;font-weight:600}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.stamp{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.live:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.kpi .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--f-disp);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .note{font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:4px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.oem{color:#fff;border:0}
.oem.TMV{background:var(--tmv)} .oem.MMV{background:var(--mmv)} .oem.FORD{background:var(--ford)}
:root[data-theme="dark"] .oem,:root:not([data-theme="light"]) .oem{color:#fff}
.s-ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.s-warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.s-crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.s-info{background:var(--info-bg);color:var(--info);border-color:transparent}
.s-ai{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:start;padding:10px 12px 10px 0;border-radius:6px;background:var(--surface2)}
.alert .bar{align-self:stretch;border-radius:4px 0 0 4px}
.alert p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.alert b{font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;white-space:normal;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.vin{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.02em}
.vin b{color:var(--ink);background:var(--accent);color:var(--accent-ink);padding:0 2px;border-radius:2px}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
/* yard */
.zones{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.zone h3{display:flex;justify-content:space-between;align-items:center}
.lot{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.slot{aspect-ratio:1/1.5;border-radius:2px;border:1px solid var(--line);background:var(--surface2);padding:0;max-width:100%}
.slot.f{border:0}
.slot.hold{outline:2px solid var(--crit);outline-offset:-2px}
.slot.sug{outline:2px dashed var(--accent);outline-offset:1px;animation:pulse 1.4s ease-in-out infinite}
.slot.dim{opacity:.18}
@keyframes pulse{50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){.slot.sug{animation:none}}
.lane{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px;font-family:var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:5px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:21;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 12px 16px;font-size:13px}
.tl li:before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl li.done:before{background:var(--ok);border-color:var(--ok)}
.tl li.now:before{background:var(--accent);border-color:var(--accent)}
.tl small{color:var(--muted);display:block}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.col h3{display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-top:8px;font-size:12.5px}
.card .why{color:var(--muted);font-size:11.5px;margin-top:4px}
/* meter */
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter span{display:block;height:100%;background:var(--ok)}
/* damage */
.carwrap{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:18px;align-items:start}
.carsvg .z{fill:var(--surface2);stroke:var(--muted);stroke-width:1.2;cursor:pointer}
.carsvg .z:hover{fill:var(--info-bg)}
.carsvg .z.sel{fill:var(--accent)}
.carsvg .z.hit{fill:var(--crit-bg);stroke:var(--crit)}
.carsvg text{font-size:9px;pointer-events:none}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field select,.field input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:13px}
/* phone */
.phone{width:300px;max-width:100%;border:10px solid var(--ink);border-radius:34px;background:var(--surface);min-height:560px;padding:16px 14px;display:flex;flex-direction:column;gap:12px;margin-inline:auto}
.phone .pbar{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.scanbox{border:2px dashed var(--muted);border-radius:10px;aspect-ratio:4/3;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px;padding:10px}
.ph4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph4 button{aspect-ratio:4/3;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:12px}
.ph4 button.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.big{font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;padding-right:4px}
.msg{padding:8px 11px;border-radius:8px;font-size:13px;max-width:92%}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--surface)}
.msg.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--line)}
.chatin{display:flex;gap:8px;margin-top:10px}
.chatin input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 10px;font-size:12px}
/* modules */
.mod{display:flex;flex-direction:column;gap:6px}
.mod .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mod p{margin:0;color:var(--muted);font-size:12.5px}
.sw{position:relative;width:38px;height:22px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s}
.sw span:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:var(--surface);border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span:after{transform:translateX(16px)}
.sw input:disabled+span{opacity:.5}
/* arch */
.layer{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:stretch;margin-bottom:8px}
.layer .ln{font-family:var(--f-disp);font-size:16px;font-weight:600;display:flex;align-items:center}
.boxes{display:flex;flex-wrap:wrap;gap:8px}
.box{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:7px 10px;font-size:12.5px}
.box small{display:block;color:var(--muted);font-size:11px}
.box.core{border-color:var(--ink)}
pre{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:12px;overflow-x:auto;font-family:var(--f-mono);font-size:12px;margin:0}
.hint{font-size:12px;color:var(--muted)}
.sec{margin-top:16px}
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.mapbox{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#2b2f33;height:min(70vh,640px);min-height:380px;touch-action:none}
.mapbox svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.mapbox svg text{fill:#EDEFF1;font-family:var(--f-body);text-anchor:middle;pointer-events:none}
.mapbox .zl{font-size:4.2px;font-weight:600;letter-spacing:.3px}
.mapbox .rl{font-size:2px;text-anchor:end;fill:#C9CED3}
.mapbox .bl{font-size:3px}
.mapbox .slab{display:none;font-size:1.3px;fill:#15191c}
.mapbox svg.near .slab{display:block}
.mapbox .ms{stroke:#E8E2C8;stroke-width:.18;cursor:pointer}
.mapbox .ms.mh{stroke:#FF4D4D;stroke-width:.6}
.mapbox .msel{fill:none;stroke:#F5C21B;stroke-width:.8;animation:mp 1.2s ease-in-out infinite}
.mapbox .route{fill:none;stroke:#F5C21B;stroke-width:.6;stroke-dasharray:1.6 1;stroke-linecap:round;stroke-linejoin:round}
@keyframes mp{50%{stroke-opacity:.2}}
@media (prefers-reduced-motion:reduce){.mapbox .msel{animation:none}}
.mctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mctl button{width:40px;height:36px;border-radius:6px;border:1px solid #5a636b;background:rgba(18,20,23,.88);color:#fff;font-size:18px}
.mapnote{position:absolute;left:10px;right:60px;bottom:10px;font-size:11px;color:#E6EAED;background:rgba(18,20,23,.75);padding:4px 8px;border-radius:4px;width:max-content;max-width:calc(100% - 70px)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  #nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .nav{flex-direction:row;gap:4px;flex:none}
  .nav button{white-space:nowrap}
  .navgrp,.tenant{display:none}
  .carwrap{grid-template-columns:1fr}
  .layer{grid-template-columns:1fr}
  .mapwrap{grid-template-columns:1fr}
  .mapbox{height:60vh}
}
</style>
</head><body>

<div class="app">
  <aside class="rail">
    <div class="brand"><div class="mark" aria-hidden="true"></div><div><b>HPS</b><small>Port Logistics · Hải Phòng</small></div></div>
    <div class="lang" role="group" aria-label="Ngôn ngữ / Language"><button data-lang="vi">Tiếng Việt</button><button data-lang="en">English</button></div>
    <div id="nav"></div>
    <div class="tenant">Đơn vị: <b>HPS · Dịch vụ Cảng Hải Phòng</b><br>Bản mẫu — dữ liệu minh hoạ</div>
  </aside>
  <main id="main"></main>
</div>
<div id="ov"></div>

<script>
/* ---------- seed data ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20261001), pick=a=>a[Math.floor(rnd()*a.length)], ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const TODAY=new Date(2026,9,1);
const dd=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')};
const vnd=n=>n.toLocaleString('vi-VN');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const OEMS={
 TMV:{name:'Toyota VN',zones:['A','B'],cycle:14,pre:['MR0','MHF','JTD'],models:['IXG','IXV','IXH','CXV0','CXH0','ALP HV','LP','YXH','YXV','HK','WG','FV']},
 MMV:{name:'Mitsubishi VN',zones:['C'],cycle:15,pre:['MK2','MMB'],models:['Xpander','Xpander Cross','Pajero Sport','Outlander','Attrage','Triton']},
 FORD:{name:'Ford VN',zones:['D'],cycle:30,pre:['MNC','MPB'],models:['Ranger','Everest','Territory','Ranger Raptor']}
};
const COLORS=['Trắng ngọc trai','Đen','Bạc','Xám','Đỏ','Xanh'];
const VESSELS=['Pacific Bloom V.2607','Asian Crest V.2608','Pacific Bloom V.2609','Morning Star V.2611'];
const VCH='ABCDEFGHJKLMNPRSTUVWXYZ0123456789';
const mkVin=p=>p+Array.from({length:14},()=>VCH[Math.floor(rnd()*VCH.length)]).join('');
const ZR=5, ZC=14;
const ST={ 'Nhập bãi':'var(--info)','Chờ PDI':'var(--muted)','Đang PDI':'var(--navy)','PPO':'var(--mmv)','Bảo dưỡng':'var(--warn)','Sẵn sàng':'var(--ok)'};
const AREAS=[['01','Cản trước'],['02','Nắp capo'],['03','Mui'],['04','Cốp sau'],['05','Cản sau'],['06','Cửa trước trái'],['07','Cửa sau trái'],['08','Cửa trước phải'],['09','Cửa sau phải'],['10','Kính lái'],['11','Gương/đèn'],['12','Mâm/lốp']];
const DTYPES=[['01','Xước'],['02','Móp'],['03','Nứt/vỡ'],['04','Bong/rỗ sơn'],['05','Bẩn/ố sáp']];

const slots={}; const V=[];

function tugAssign(m){
  const need=tugNeed(m.loa,m.wind);

  const pick=[];let bp=0;for(const t of pool){if(pick.length>=need.n&&bp>=need.bp)break;pick.push(t);bp+=t.bp}
  const ok=pick.length>=need.n&&bp>=need.bp;
  return {need,pick:pick.map(t=>t.n),bp,ok};
}

const CRANES=[['Cẩu bánh lốp 100 t',100,6],['Cẩu bánh xích 250 t',250,8],['Cẩu bánh xích 400 t',400,10],['Cẩu nổi 600 t',600,15]];

function ogCheck(p){
  const deck=0.95, totH=+(p.H+deck).toFixed(2), wide=p.W>2.5, high=totH>4.2, long=p.L>20, gross=p.T+(p.T>80?4*Math.ceil(p.T*1.1/20):p.T>40?18:14), heavy=gross>40;
  const lines=Math.ceil(p.T*1.1/20);
  const trailer=p.T<=40?'Lowbed 3 trục':p.T<=80?'Lowbed 4 trục':`Module thủy lực ${lines} trục`;
  const escort=p.W>3.5||p.L>30;
  const req=+(p.T*1.1+p.T*0.03+2).toFixed(1);
  const cr=CRANES.map(([n,swl,rmin])=>({n,cap:+(swl*Math.min(1,rmin/p.R)).toFixed(1)})).map(c=>({...c,u:Math.round(req/c.cap*100)}));
  const crane=cr.find(c=>c.u<=85);
  const press=+(p.T/p.A).toFixed(1);
  const lash=Math.ceil(p.T/7);
  const route=[['Cầu vượt nút giao (tĩnh không 4,75 m)',totH<=4.75],['Đường dây điện trung thế (cao 6,0 m)',totH<=5.5],['Cầu trên tuyến (tải trọng 60 t toàn xe)',gross<=60],['Cua vuông góc (bán kính 15 m)',p.L<=25||p.T>80]];
  return {totH,wide,high,long,heavy,gross,trailer,escort,req,cr,crane,press,lash,route,permit:wide||high||long||heavy};
}

function roroSim(p,opt){
  const drive=p.km/p.v*60, ride=p.km/30*60;
  const gate=opt?0.3:3, park=opt?1.5:4, wait=opt?4:12, quay=opt?1:2;
  const cyc=drive+gate+park+wait+ride+quay;
  let thr=p.D/cyc; const busCap=p.B*p.seat/(2*ride+5); const capped=thr>busCap; if(capped)thr=busCap;
  const hrs=p.N/thr/60, dh=p.D*hrs;
  return {cyc,thr:thr*60,hrs,dh,cost:dh*p.cost/1000,capped,parts:[['Lái xe từ cảng về bãi',drive],['Kiểm tra hư hỏng tại cổng',gate],['Tìm ô, đỗ xe',park],['Chờ xe đưa đón',wait],['Xe đưa đón quay lại cảng',ride],['Nhận xe, quét VIN tại cầu tàu',quay]]};
}

function auCalc(){
  const rem={};POOLS.forEach(([k])=>rem[k]=1);let energy=0,capex=0,opex=0;const per=[];
  SOL.forEach(s=>{if(!auOn[s[0]])return;let fte=0;Object.entries(s[3]).forEach(([k,r])=>{const before=auHead[k]*rem[k];rem[k]*=(1-r);fte+=before-auHead[k]*rem[k]});const e=s[4]();energy+=e;capex+=s[5];opex+=s[6];per.push({s,fte,save:fte*auCost+e-s[6]})});
  const fte=POOLS.reduce((a,[k])=>a+auHead[k]*(1-rem[k]),0);
  const monthly=fte*auCost+energy-opex-60;
  return {fte,energy,capex,opex,monthly,year:monthly*12,payback:monthly>0?capex/monthly:null,per};
}

function applyVB(){const m=document.getElementById('msvg');if(!m)return;m.setAttribute('viewBox',mapS.vb.join(' '));m.classList.toggle('near',mapS.vb[2]<75)}
function zoomAt(f,cx,cy){const m=document.getElementById('msvg');if(!m)return;const vb=mapS.vb;let px=vb[0]+vb[2]/2,py=vb[1]+vb[3]/2;
  if(cx!=null){const pt=m.createSVGPoint();pt.x=cx;pt.y=cy;const p=pt.matrixTransform(m.getScreenCTM().inverse());px=p.x;py=p.y}
  const nw=Math.min(260,Math.max(16,vb[2]*f)),k=nw/vb[2];mapS.vb=[px-(px-vb[0])*k,py-(py-vb[1])*k,nw,vb[3]*k];applyVB()}
function bindMap(){
  const m=document.getElementById('msvg');if(!m)return;let drag=null;
  m.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vb:[...mapS.vb],moved:false};try{m.setPointerCapture(e.pointerId)}catch(err){}});
  m.addEventListener('pointermove',e=>{if(!drag)return;const r=m.getBoundingClientRect();const k=Math.max(mapS.vb[2]/r.width,mapS.vb[3]/r.height);const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){mapS.vb[0]=drag.vb[0]-dx*k;mapS.vb[1]=drag.vb[1]-dy*k;applyVB()}});
  const up=e=>{if(drag&&!drag.moved){const t=document.elementFromPoint(e.clientX,e.clientY);const sEl=t&&t.closest&&t.closest('[data-msel]');if(sEl){mapS.sel=sEl.dataset.msel;mapS.gps=false;render()}}drag=null};
  m.addEventListener('pointerup',up);m.addEventListener('pointercancel',()=>drag=null);
  m.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?0.82:1.22,e.clientX,e.clientY)},{passive:false});
  const f=document.getElementById('mf');if(f)f.addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('mq').value.trim().toUpperCase();mapS.q=q;mapS.res=q?V.filter(v=>v.vin.includes(q)):[];if(mapS.res.length===1){mapS.sel=mapS.res[0].vin;focusSlot(mapS.res[0].slot)}render()});
}

function parseFM(txt){
  const s=txt.toLowerCase(), A=FM_ASSETS[fmSite];
  const words=s.split(/[^a-zà-ỹđ0-9]+/).filter(w=>w.length>1);
  let best=null,bs=0;A.forEach(a=>{const n=(a[1]+' '+a[3]+' '+trS(a[1])+' '+trS(a[3])).toLowerCase();let sc=0;words.forEach(w=>{if(n.includes(w))sc+=w.length>3?2:1});if(sc>bs){bs=sc;best=a}});
  if(bs<3)best=null;
  const P1=/cháy|khói|khét|rò gas|điện giật|chập|ngập|tràn|sập|nổ|kẹt người|phanh không ăn|trôi|fire|smoke|burn|gas leak|shock|flood|collapse|brake/;
  const P2=/chảy dầu|kêu|rò|hỏng|không chạy|chậm|nóng|đọng sương|rung|kẹt|báo lỗi|mức cao|leak|noise|broken|not working|slow|hot|vibrat|jam|alarm|fault/;
  const pri=P1.test(s)?'P1':P2.test(s)?'P2':'P3';
  const cat=best?best[2]:(/điện|tủ|khét|chập|electric|panel/.test(s)?'Điện':/nước|bơm|ngập|tràn|water|pump|flood/.test(s)?'Môi trường':/lạnh|kho|sương|cold|frost/.test(s)?'Lạnh':/cháy|báo cháy|fire/.test(s)?'PCCC':'Kết cấu');
  const trade=TRADE[cat]||'Thầu cơ khí';
  const c=CONTR.filter(x=>x[0]===trade).sort((a,b)=>(a[4]==='Sẵn sàng'?0:1)-(b[4]==='Sẵn sàng'?0:1)||a[3]-b[3])[0]||CONTR[3];
  const parts={'Khí nén':'Gioăng, dầu máy nén, lọc dầu','Điện':'Camera nhiệt, đầu cốt, CB dự phòng','Điều khiển':'Camera nhiệt, đầu cốt, CB dự phòng','Lạnh':'Gas lạnh, đồng hồ áp, bộ điều khiển dự phòng','Cửa':'Cảm biến cửa, dây curoa, ray','Môi trường':'Bơm chìm dự phòng, bao cát','Thiết bị nâng':'Má phanh, dụng cụ cân chỉnh phanh','PCCC':'Đầu báo dự phòng, máy đo vòng lặp'}[cat]||'Theo khảo sát';
  const risk=pri==='P1'?'Nguy cơ an toàn hoặc dừng vận hành: báo đồng thời đội PCCC cơ sở và trưởng ca, khoanh vùng thiết bị.':pri==='P2'?'Có thể dẫn tới dừng máy nếu để quá 1 ca.':'Không ảnh hưởng vận hành ngay.';
  return {txt,best,pri,cat,trade,c,parts,risk,sla:fmSLA[pri]};
}

Object.assign(EN,{"Lô KB1-1, KCN Nam Đình Vũ, Đông Hải, Hải Phòng (20.8161, 106.8105)":"Lot KB1-1, Nam Dinh Vu IP, Dong Hai, Hai Phong (20.8161, 106.8105)","Lô KB1-1, KCN Nam Đình Vũ, Đông Hải, Hải Phòng (#, #)":"Lot KB1-1, Nam Dinh Vu IP, Dong Hai, Hai Phong (#, #)"});
function trS(t){
  if(!t)return t; if(EN[t]!==undefined)return EN[t];
  if(t.startsWith('· '))return '· '+trS(t.slice(2));
  const nums=t.match(NUMRE)||[];
  if(nums.length){const key=t.replace(NUMRE,'#');if(EN[key]!==undefined){let i=0;return EN[key].replace(/#/g,()=>nums[i]!==undefined?nums[i++]:'#')}}
  for(const [re,f] of RULES){const m=t.match(re);if(m)return f(m)}
  if(t.includes(' · ')){const ps=t.split(' · ');const o=ps.map(p=>trS(p.trim()));if(o.some((x,i)=>x!==ps[i].trim()))return o.join(' · ')}
  return t;
}
function numFix(t){return t.replace(/(?<![\w.])(\d+),(\d+)(?![\d,])/g,'$1\u2063$2').replace(/(?<![\w.])(\d{1,3})((?:\.\d{3})+)(?![\d.])/g,(m,a,b2)=>a+b2.replace(/\./g,',')).replace(/\u2063/g,'.')}
function translateDOM(root){
  if(lang!=='en'||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const todo=[];
  while(n=w.nextNode()){const p=n.parentNode&&n.parentNode.nodeName;if(p==='SCRIPT'||p==='STYLE')continue;if(p==='PRE'){n.nodeValue=n.nodeValue;continue}todo.push(n)}
  todo.forEach(n=>{const v=n.nodeValue;const m=v.match(/^(\s*)([\s\S]*?)(\s*)$/);if(!m[2])return;const t=m[2].replace(/\s+/g,' ');const r=numFix(trS(t));if(r!==t)n.nodeValue=m[1]+r+m[3]});
  root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e=>['placeholder','aria-label','title'].forEach(a=>{const v=e.getAttribute(a);if(v){const r=trS(v.trim());if(r!==v.trim())e.setAttribute(a,r)}}));
}
function answerEN(q){
  const s=q.toLowerCase();
  const tok=(q.toUpperCase().match(/[A-Z0-9]{5,}/g)||[]);
  for(const t of tok){const v=V.find(x=>x.vin.includes(t));if(v)return `VIN ${v.vin}: ${OEMS[v.oem].name} ${v.model}, slot ${v.slot}, status ${trS(v.status)}${v.holds.length?', on hold '+v.holds.map(h=>({HQ:'customs',ĐK:'registry',OEM:'OEM'}[h])).join('/'):''}. ${v.arr} days in the yard.`}
  for(const o of Object.keys(OEMS))if(s.includes(o.toLowerCase())||s.includes(OEMS[o].name.split(' ')[0].toLowerCase())){const a=V.filter(v=>v.oem===o);return `${o} has ${a.length} cars in stock: ${a.filter(v=>v.status==='Sẵn sàng').length} ready, ${a.filter(v=>v.arr>30).length} over 30 days, ${a.filter(v=>v.holds.length).length} on hold.`}
  if(/tàu lai|lai dắt|tug/.test(s)){const p=MOVES.filter(m=>!m.tugs.length);return `${MOVES.length} towage jobs today, ${p.length} still unassigned. The 22:00 RoRo Morning Star job is one tug short because of force 6 wind; hire one more or delay. Tug 05 needs bunkering before 16:40.`}
  if(/siêu trường|siêu trọng|dự án|kết cấu|dầm|oog|project|heavy|oversize/.test(s))return '3 heavy-lift projects are running. PRJ-2602 (42 m box girder, 118 t) still lacks its oversize road permit; transport is planned for 09/10. The heavy-cargo yard has 18% space left.';
  if(/tntx|tạm nhập|tái xuất|ngoại quan|bonded|re-export/.test(s))return '4 temporary-import-for-re-export declarations are in store, 92 pallets. Declaration …4521 has 9 days left to re-export; the Lang Son border gate is congested with reefer trucks.';
  if(/kiểm định|sự cố|thiết bị|fm|bảo trì|inspection|equipment|incident/.test(s)){const all=Object.values(FM_ASSETS).flat().filter(a=>a[7]!=null&&a[7]<90).sort((a,b)=>a[7]-b[7]);return `${all.length} items are due for statutory inspection within 90 days. Most urgent: ${all.slice(0,2).map(a=>trS(a[1])+' ('+a[7]+' days)').join(', ')}. Open incidents: ${Object.values(FM_TICKETS).flat().length}, ${Object.values(FM_TICKETS).flat().filter(t=>t[5]<0).length} past SLA.`}
  if(/kho|nhiệt|lạnh|cold|room|temp/.test(s)){const r=ROOMS[1];return `Room 8 is at ${r.now}°C against a ${r.sp}°C setpoint and has been rising for 6 hours. Likely an iced evaporator or the high-speed door. Mr Cường has been notified. Rooms 7, 9 and 10 are stable.`}
  if(/bảo dưỡng|ắc quy|maint|battery/.test(s))return `${V.filter(mDue).length} cars are due for storage maintenance. Work orders have been created and assigned to B2 licence holders.`;
  if(/tàu|nhân lực|người|vessel|manpower|people|crew/.test(s))return 'Vessel V.2610 ETA 03/10 22:00 with 412 cars. At 7.5 cars per driver per hour and a 4-hour discharge target you need 14 drivers, 4 tally clerks and 2 QC. 11 B2 drivers are on the night roster, so call in 3 casual workers.';
  return 'I did not understand that. Try a VIN, an OEM name, cold rooms, maintenance, inspections or the next vessel.';
}

function answer(q){
  const s=q.toLowerCase().normalize('NFC');
  const tok=(q.toUpperCase().match(/[A-Z0-9]{5,}/g)||[]);
  for(const t of tok){const v=V.find(x=>x.vin.includes(t));if(v)return `VIN ${v.vin}: ${OEMS[v.oem].name} ${v.model}, ô ${v.slot}, trạng thái ${v.status}${v.holds.length?', đang bị chặn '+v.holds.join('/'):''}. Đã ở bãi ${v.arr} ngày.`}
  for(const o of Object.keys(OEMS))if(s.includes(o.toLowerCase())||s.includes(OEMS[o].name.split(' ')[0].toLowerCase())){const a=V.filter(v=>v.oem===o);return `${o} đang tồn ${a.length} xe: ${a.filter(v=>v.status==='Sẵn sàng').length} sẵn sàng, ${a.filter(v=>v.arr>30).length} xe quá 30 ngày, ${a.filter(v=>v.holds.length).length} xe bị chặn.`}
  if(/kho|nhiệt|lạnh/.test(s)){const r=ROOMS[1];return `Kho 8 hiện ${r.now}°C, cài ${r.sp}°C, tăng liên tục 6 giờ qua. Nghi máy nén hoặc dàn lạnh đóng băng. Đã báo Mr Cường. Kho 7, 9, 10 ổn định.`}
  if(/tàu lai|lai dắt|tug/.test(s)){const p=MOVES.filter(m=>!m.tugs.length);return `Hôm nay ${MOVES.length} lượt lai dắt, còn ${p.length} lượt chờ phân công. Lượt 22:00 RoRo Morning Star thiếu 1 tàu lai do gió cấp 6; đề xuất thuê thêm hoặc lùi giờ. Tug 05 cần cấp dầu trước 16:40.`}
  if(/siêu trường|siêu trọng|dự án|kết cấu|dầm|oog/.test(s))return 'Đang chạy 3 dự án hàng siêu trường siêu trọng. PRJ-2602 (dầm hộp 42 m, 118 t) còn thiếu giấy phép lưu hành, dự kiến vận chuyển 09/10. Bãi hàng nặng còn 18% diện tích.';
  if(/tntx|tạm nhập|tái xuất|ngoại quan/.test(s))return 'Kho đang giữ 4 tờ khai tạm nhập tái xuất, 92 pallet. Tờ khai …4521 còn 9 ngày đến hạn tái xuất; cửa khẩu Lạng Sơn đang ùn xe lạnh.';
  if(/kiểm định|sự cố|thiết bị|fm|bảo trì/.test(s)){const all=Object.values(FM_ASSETS).flat().filter(a=>a[7]!=null&&a[7]<90);return `${all.length} thiết bị sắp hết hạn kiểm định trong 90 ngày, gấp nhất: ${all.sort((a,b)=>a[7]-b[7]).slice(0,2).map(a=>a[1]+' ('+a[7]+' ngày)').join(', ')}. Sự cố mở: ${Object.values(FM_TICKETS).flat().length}, trong đó ${Object.values(FM_TICKETS).flat().filter(t=>t[5]<0).length} quá SLA.`}
  if(/bảo dưỡng|ắc quy/.test(s))return `${V.filter(mDue).length} xe đến hạn bảo dưỡng tồn. Lệnh việc đã tạo và giao cho người có bằng B2.`;
  if(/tàu|nhân lực|người/.test(s))return 'Tàu V.2610 ETA 03/10 22:00, 412 xe. Với năng suất 7,5 xe/lái xe/giờ và mục tiêu dỡ xong trong 4 giờ, cần 14 lái xe, 4 kiểm đếm, 2 QC. Hiện đủ 11 người có B2 trong ca đêm, cần huy động thêm 3 thời vụ.';
  return 'Tôi chưa hiểu câu này. Thử hỏi theo VIN, tên OEM, kho lạnh, bảo dưỡng hoặc tàu sắp tới.';
}

  if(t.dataset.fmsample){fmParsed=parseFM(t.dataset.fmsample);fmMsg='';render();return}
  if(t.dataset.fmparse){const v=(document.getElementById('fmtxt')||{}).value||'';if(v.trim()){fmParsed=parseFM(v.trim());fmMsg=''}render();return}
  if(t.dataset.fmcreate&&fmParsed){const p=fmParsed;(FM_TICKETS[fmSite]=FM_TICKETS[fmSite]||[]).unshift([p.pri,p.txt,'Zalo · AI',p.best?p.best[0]:'—',p.c[1],p.sla,'Mới']);fmMsg=lang==='en'?`Ticket created and sent to ${p.c[1]} via Zalo. Response due within 30 minutes.`:`Đã tạo phiếu và gửi Zalo cho ${p.c[1]}. Hạn phản hồi 30 phút.`;fmParsed=null;render();return}
  if(t.dataset.fmstorm){fmStorm=!fmStorm;render();return}
  if(t.dataset.fmact==='pack'){fmMsg=lang==='en'?'Inspection pack prepared: 16 items in order, with 3 missing/expiring items flagged. ZIP sent to the safety officer.':'Đã gom bộ hồ sơ: 16 mục theo thứ tự, đánh dấu các mục thiếu hoặc sắp hết hạn. File ZIP đã gửi cán bộ an toàn.';render();return}
  if(t.dataset.lang){lang=t.dataset.lang;try{localStorage.setItem('c24lang',lang)}catch(err){}document.getElementById('ov').innerHTML='';render();return}
  if(t.dataset.ctab){cTab=t.dataset.ctab;cMsg='';render();return}
  if(t.dataset.cact){cMsg={defrost:'Đã gửi lệnh xả đá cưỡng bức tới HMI Dãy 2, kho 8. Dự kiến về −22°C sau khoảng 50 phút. Đã ghi log.',lock:'Kho 8 đã khóa nhập. App thủ kho sẽ chặn quét nhập vào kho 8 và chuyển gợi ý sang kho 9.',wo:'Đã tạo lệnh bảo trì cho tổ kỹ thuật lạnh: vệ sinh bình ngưng, kiểm tra van đẩy. Hạn hoàn thành 10/10.',report:'Đã tạo báo cáo nhiệt độ lô A-26-0912 (12/09 → 01/10): min −20,1°C, max −18,6°C, không có lần vượt ngưỡng. File PDF gửi tới email chủ hàng A.'}[t.dataset.cact];render();return}
  if(t.dataset.fmsite){fmSite=t.dataset.fmsite;fmParsed=null;fmMsg='';render();return}
  if(t.dataset.fmtab){fmTab=t.dataset.fmtab;fmMsg='';render();return}
  if(t.dataset.map){const v=V.find(x=>x.vin===t.dataset.map);if(v){mapS.sel=v.vin;mapS.gps=false;focusSlot(v.slot)}go('map');return}
  if(t.dataset.mz){if(t.dataset.mz==='fit'){mapS.vb=[0,0,200,160];applyVB()}else zoomAt(t.dataset.mz==='in'?0.7:1.43);return}
  if(t.dataset.mf!==undefined){mapS.f=t.dataset.mf;render();return}
  if(t.dataset.mgps){mapS.gps=!mapS.gps;render();return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.vin){drawer(t.dataset.vin);return}
  if(t.hasAttribute('data-close')){document.getElementById('ov').innerHTML='';return}
  if(t.dataset.ask){ask(t.dataset.ask);return}
  if(t.dataset.zone){dsel=t.dataset.zone;render();return}
  if(t.dataset.shot!==undefined){shots[+t.dataset.shot]=1;render();return}
  if(t.dataset.fs!==undefined){fs=+t.dataset.fs;if(fs===0)shots=[0,0,0,0];render();return}
});
document.addEventListener('change',e=>{const d=e.target.dataset||{};if(d.rs){const v=parseFloat(e.target.value);if(v>0){rs[d.rs]=v;render()}return}if(d.auon){auOn[d.auon]=e.target.checked?1:0;render();return}if(d.auh){auHead[d.auh]=Math.max(0,+e.target.value||0);render();return}if(d.aux){const v=Math.max(0,+e.target.value||0);if(d.aux==='cost')auCost=v||1;if(d.aux==='power')auPower=v;if(d.aux==='fuel')auFuel=v;render();return}const sl=e.target.dataset&&e.target.dataset.sla;if(sl){const v=parseInt(e.target.value,10);if(v>0)fmSla(sl,v);return}const m=e.target.dataset&&e.target.dataset.mod;if(!m)return;enabled[m]=e.target.checked;try{localStorage.setItem('c24mods',JSON.stringify(enabled))}catch(err){}renderNav()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('ov').innerHTML=''});
render();
</script>
